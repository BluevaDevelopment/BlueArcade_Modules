display_name: "Lucky Pillars"

description:
  - "<dark_gray><strikethrough>----------------------------------------------</strikethrough></dark_gray>"
  - "<green>Game</green> <gray>-</gray> <yellow><bold>Lucky Pillars</bold></yellow>"
  - " "
  - "<white>Description:</white>"
  - "<gray>Spawn on bedrock pillars and receive random items.</gray>"
  - "<gray>Use these items to eliminate opponents and survive.</gray>"
  - " "
  - "<dark_gray><strikethrough>----------------------------------------------</strikethrough></dark_gray>"

vote_menu:
  name: "<green>Lucky Pillars</green>"
  lore:
    - "<gray>Spawn on top of bedrock pillars.</gray>"
    - "<gray>Get random items and eliminate opponents.</gray>"
    - ""
    - "<white>{votes}</white> <gray>votes.</gray>"

vote_menu_modifiers:
  title: "<green>Lucky Pillars</green> <gray>-</gray> <yellow>Modifiers</yellow>"

votes:
  labels:
    modifiers:
      none: "None"
      elytra: "Elytra"
      swap: "Swap Positions"
      speed: "Speed"
      slow_fall: "Slow Fall"
      invisibility: "Invisibility"
      double_health: "Double Health"
      one_heart: "1 Heart"
      unbreakable: "Unbreakable"
      ultra_jump: "Ultra Jump"
      rising_lava: "Rising Lava"
    modifier_lore:
      none: "<gray>No modifiers.</gray>"
      elytra: "<gray>All players get an elytra.</gray>"
      swap: "<gray>Swap positions every 15 seconds.</gray>"
      speed: "<gray>Faster random block drops.</gray>"
      slow_fall: "<gray>All players get slow falling.</gray>"
      invisibility: "<gray>All players are invisible for 30s.</gray>"
      double_health: "<gray>Everyone starts with 20 hearts.</gray>"
      one_heart: "<gray>Everyone plays with 1 heart.</gray>"
      unbreakable: "<gray>Blocks cannot be broken.</gray>"
      ultra_jump: "<gray>Everyone jumps much higher.</gray>"
      rising_lava: "<gray>Lava rises from the bottom over time.</gray>"
  messages:
    broadcast: "<yellow>{player}</yellow> <gray>voted for</gray> <aqua>{modifier}</aqua> <yellow>({votes} votes)</yellow>"
    selected:
      sources:
        popular: "by popular vote"
        default: "by default"
      modifier: "<gray>Selected modifier:</gray> <gold>{modifier}</gold> <gray>{source}.</gray>"
    invalid: "<red>That modifier is not available.</red>"
    not_available: "<red>You can only vote while waiting for the game to start.</red>"
    no_permission: "<red>You do not have permission to vote for</red> <yellow>{modifier}</yellow><red>.</red>"
    cooldown: "<red>You must wait {time} seconds before voting again.</red>"
    click_to_vote: "<green>Click to vote</green>"
    votes_count: "<gray>Votes:</gray> <white>{count}</white>"
    close: "<red>Close</red>"
    close_lore: "<gray>Close this menu.</gray>"

stats:
  descriptions:
    wins: "LuckyPillars victories"
    games_played: "LuckyPillars matches played"
    kills: "Opponents eliminated in LuckyPillars"
