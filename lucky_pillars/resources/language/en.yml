setup_messages:
  team:
    usage: "{prefix} <red>Usage:</red> <yellow>/baa game <id> lucky_pillars team <count|size> <value></yellow>"
    success: "{prefix} <green>Team {setting} set to {value} for {game} in arena {arena_id}.</green>"
    invalid_limit: "{prefix} <red>Team configuration exceeds arena max players ({max_players}).</red>"
    invalid_value: "{prefix} <red>Team {setting} must be greater than 0.</red>"
    invalid_count: "{prefix} <red>Team count must be at least 2.</red>"
    numeric_ids_only: "{prefix} <red>Team ID must be a number between {min} and {max}.</red>"
  team_spawn:
    usage_add: "{prefix} <red>Usage:</red> <yellow>/baa game <id> lucky_pillars team spawn add</yellow>"
    usage_set: "{prefix} <red>Usage:</red> <yellow>/baa game <id> lucky_pillars team spawn set <team_id></yellow>"
    usage_remove: "{prefix} <red>Usage:</red> <yellow>/baa game <id> lucky_pillars team spawn remove <team_id></yellow>"
    teams_not_configured: "{prefix} <red>Team count is not configured yet. Set it first with <yellow>/baa game <id> lucky_pillars team count <n></yellow>.</red>"
    added: "{prefix} <green>Team spawn added for slot <white>{slot}/{count}</white> at your current location.</green>"
    all_slots_filled: "{prefix} <red>All {count} team spawn slots are already filled.</red>"
    set: "{prefix} <green>Team spawn set for team <white>{team}</white> at your current location.</green>"
    removed: "{prefix} <yellow>Team spawn removed for team <white>{team}</white>.</yellow>"
  region:
    usage: "{prefix} <red>Usage:</red> <yellow>/baa game <id> lucky_pillars region <set|clear></yellow>"
    must_use_stick: "{prefix} <red>Select two corners with the setup tool first.</red>"
    set: "{prefix} <green>Regeneration region saved.</green> <gray>Blocks:</gray> <white>{blocks}</white> <gray>({x}x{y}x{z})</gray>"
    cleared: "{prefix} <yellow>Regeneration region cleared.</yellow>"
