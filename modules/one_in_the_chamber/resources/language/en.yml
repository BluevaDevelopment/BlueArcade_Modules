# Vote menu
vote_menu:
  name: "<green>One In The Chamber</green>"
  lore:
    - "<gray>Precision bow duels with a single arrow.</gray>"
    - "<gray>Earn arrows on every elimination.</gray>"
    - ""
    - "<white>{votes}</white> <gray>votes.</gray>"

stats:
  labels:
    arrows_shot: "Arrows shot"
    hits_landed: "Hits landed"
    kills: "Kills"
    games_played: "One In The Chamber games played"
    wins: "One In The Chamber wins"

messages:
  eliminated: "<red>You are out! You are now a spectator.</red>"
  deaths:
    killed_by_player:
      - "<dark_red>✘</dark_red> <yellow>{killer}</yellow> <gray>lined up the perfect shot on</gray> <red>{victim}</red><gray>.</gray>"
      - "<dark_red>✘</dark_red> <red>{victim}</red> <gray>was picked off by</gray> <yellow>{killer}</yellow><gray>'s arrow.</gray>"
      - "<dark_red>✘</dark_red> <yellow>{killer}</yellow> <gray>didn't miss when</gray> <red>{victim}</red> <gray>peeked.</gray>"
      - "<dark_red>✘</dark_red> <red>{victim}</red> <gray>couldn't dodge</gray> <yellow>{killer}</yellow><gray>'s chamber bolt.</gray>"
    generic:
      - "<dark_red>✘</dark_red> <red>{victim}</red> <gray>ran out of chances in the arena.</gray>"
      - "<dark_red>✘</dark_red> <red>{victim}</red> <gray>fell before another arrow could be loosed.</gray>"
      - "<dark_red>✘</dark_red> <red>{victim}</red> <gray>lost their shot and their life.</gray>"

titles:
  you_died:
    title: "<red><bold>YOU DIED</bold></red>"
    subtitle: "<gray>Better luck next time.</gray>"
  classified:
    title: "<yellow><bold>CLASSIFIED</bold></yellow>"
    subtitle: "<gray>You have been eliminated.</gray>"

scoreboard:
  mode_labels:
    last_standing: "Last Arrow"
    most_kills: "Most Kills"
  last_standing:
    title: "<bold><gradient:aqua:light_purple>Blue Arcade</gradient></bold>"
    lines:
      - ""
      - "<white>Arena:</white> <aqua>{arena}</aqua>"
      - "<white>Game:</white> <aqua>One In The Chamber</aqua>"
      - "<white>Time:</white> <aqua>{time}</aqua>"
      - ""
      - "<white>Kills:</white> <red>{kills}</red>"
      - "<white>Alive:</white> <green>{alive}</green>"
      - "<white>Spectators:</white> <gray>{spectators}</gray>"
      - ""
      - "<yellow>www.blueva.net</yellow>"
  most_kills:
    title: "<bold><gradient:aqua:light_purple>Blue Arcade</gradient></bold>"
    lines:
      - ""
      - "<white>Arena:</white> <aqua>{arena}</aqua>"
      - "<white>Game:</white> <aqua>One In The Chamber</aqua>"
      - "<white>Time:</white> <aqua>{time}</aqua>"
      - ""
      - "<green>➊</green> <white>{place_1}</white> <gray>{kills_1}</gray>"
      - "<gold>➋</gold> <white>{place_2}</white> <gray>{kills_2}</gray>"
      - "<red>➌</red> <white>{place_3}</white> <gray>{kills_3}</gray>"
      - "<dark_gray>➍</dark_gray> <gray>{place_4}</gray> <dark_gray>{kills_4}</dark_gray>"
      - "<dark_gray>➎</dark_gray> <gray>{place_5}</gray> <dark_gray>{kills_5}</dark_gray>"
      - ""
      - "<white>Your Kills:</white> <red>{kills}</red>"
      - ""
      - "<yellow>www.blueva.net</yellow>"

