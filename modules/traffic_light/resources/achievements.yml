        name: "First steps"
        description:
          - "Play your first Traffic Light game."
        conditions:
          - "{bluearcade_stat_module_traffic_light_games_played} >= 1"
        rewards:
          commands:
            - "arcadeadmin credits give {player} 10"
            - "arcadeadmin xp give {player} 10"
          messages:
            - "  <gold>⛁</gold> <yellow>+10 credits</yellow>"
