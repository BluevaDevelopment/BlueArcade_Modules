    name: "Rookie Racer"
    description:
      - "Finish your first races."
    icon: "FEATHER"
    phases:
      1:
        name: "First lap"
        description:
          - "Play your first race."
        conditions:
          - "{bluearcade_stat_module_race_games_played} >= 1"
        rewards:
          commands:
            - "arcadeadmin credits give {player} 10"
            - "arcadeadmin xp give {player} 10"
          messages:
            - "  <gold>⛁</gold> <yellow>+10 credits</yellow>"
            - "  <dark_purple>✹</dark_purple> <light_purple>+10 XP</light_purple>"
