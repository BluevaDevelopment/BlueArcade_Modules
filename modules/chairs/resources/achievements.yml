category:
  id: "chairs"
  name: "Chairs"
  description:
    - "Achievements tied to Chairs."
  icon: "MINECART"
  sort_order: 30

achievements:
  seat_hunter:
    name: "Seat Hunter"
    description:
      - "Play Chairs matches."
    icon: "OAK_BOAT"
    phases:
      1:
        name: "First seat"
        description:
          - "Play 1 match."
        conditions:
          - "{bluearcade_stat_module_chairs_games_played} >= 1"
      2:
        name: "Regular rider"
        description:
          - "Play 20 matches."
        conditions:
          - "{bluearcade_stat_module_chairs_games_played} >= 20"

  last_sitter:
    name: "Last Sitter"
    description:
      - "Win Chairs matches."
    icon: "SADDLE"
    phases:
      1:
        name: "First victory"
        description:
          - "Win 1 match."
        conditions:
          - "{bluearcade_stat_module_chairs_wins} >= 1"
      2:
        name: "Chair champion"
        description:
          - "Win 15 matches."
        conditions:
          - "{bluearcade_stat_module_chairs_wins} >= 15"
