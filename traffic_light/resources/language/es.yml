    void:
      - "<dark_red>✘</dark_red> <red>{player}</red> <gray>resbaló fuera del camino.</gray>"
      - "<dark_red>✘</dark_red> <red>{player}</red> <gray>calculó mal un salto y cayó.</gray>"
      - "<dark_red>✘</dark_red> <red>{player}</red> <gray>cayó dando tumbos al vacío.</gray>"
