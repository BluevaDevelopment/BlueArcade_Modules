    generic:
      - "<dark_red>✘</dark_red> <red>{victim}</red> <gray>falló el último bloque.</gray>"
      - "<dark_red>✘</dark_red> <red>{victim}</red> <gray>cayó al vacío de abajo.</gray>"
      - "<dark_red>✘</dark_red> <red>{victim}</red> <gray>no pudo escapar del derrumbe.</gray>"
